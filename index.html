<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold & Responsive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            /* Scales font between 3rem and 8rem based on viewport width */
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .image-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>למה אתה קורא את זה? תתרכז במצגת יהומו</h1>
        
        <div class="image-container">
            <img src="vid.webp">
        </div>
    </div>
</body>
</html>
